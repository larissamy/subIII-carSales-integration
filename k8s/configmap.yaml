apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-buyers-config
data:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: "jdbc:sqlite:/data/auth-buyers.db"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.sqlite.JDBC"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.community.dialect.SQLiteDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  APP_JWT_EXPIRATION_MINUTES: "120"
